<!doctype html>
<html lang="en" data-theme="dark" data-accent="cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070c16">
  <meta name="description" content="W.A.T.A. apps, trips, profile, and instructions in one place.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="W.A.T.A. Tech Hub">
  <script>if(location.protocol==="file:")location.replace(`https://app.cleanwata.org/${location.hash}`)</script>
  <script src="theme-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/tech-hub/icon-32-v5.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/tech-hub/apple-touch-icon-v5.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css?v=31">
  <title>W.A.T.A. Tech Hub</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="App quick links">
      <button class="sidebar-brand" type="button" data-view="home" aria-label="Return to apps">
        <img src="/assets/tech-hub/brand-logo-v3.png" alt="" width="40" height="40">
        <span><strong>W.A.T.A.</strong><small>Tech Hub</small></span>
      </button>
      <p class="sidebar-label">Quick links</p>
      <nav id="quickLinks" aria-live="polite"></nav>
      <div class="connection"><span class="connection-dot"></span><span id="connectionLabel">Checking access</span></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="home-mark" type="button" data-view="home" aria-label="Return to apps"><img src="/assets/tech-hub/brand-logo-v3.png" alt="" width="42" height="42"></button>
        <button class="menu-button" id="menuButton" type="button" aria-label="Open W.A.T.A. menu" aria-expanded="false" aria-controls="menuDrawer"><span></span><span></span><span></span></button>
      </header>
      <section id="app" class="content" aria-live="polite"></section>
      <footer class="site-footer"><img src="/assets/wata-logo.png" alt="" width="26" height="26"><span>Water Access to All</span><small>Tech Hub v1.1.1</small></footer>
    </main>
  </div>
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="menu-drawer" id="menuDrawer" aria-label="Tech Hub menu" aria-hidden="true">
    <div class="drawer-head"><div id="menuProfile" class="menu-profile"><span class="avatar">··</span><span><strong>Loading</strong><small>Checking access</small></span></div><button id="closeMenu" class="close-button" type="button" aria-label="Close menu">×</button></div>
    <nav class="drawer-nav">
      <button type="button" data-view="home"><span>Apps</span><small>Your available tools</small></button>
      <button type="button" data-view="profile"><span>Profile</span><small>Your shared W.A.T.A. details</small></button>
      <button type="button" id="instructionsButton"><span>Instructions</span><small>PDF and PNG guides</small></button>
      <div class="guide-list" id="menuGuideList" hidden></div>
      <button type="button" data-view="about"><span>About W.A.T.A.</span><small>Mission, vision, EIN, and boilerplate</small></button>
      <button type="button" data-view="settings"><span>Settings &amp; help</span><small>Access, offline use, and support</small></button>
    </nav>
    <div class="appearance">
      <p>Appearance</p>
      <div class="theme-choice" role="group" aria-label="Color theme"><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="light">Light</button></div>
      <div class="accent-choice" role="group" aria-label="Accent color"><button type="button" data-accent-choice="cyan" aria-label="Cyan accent"></button><button type="button" data-accent-choice="pink" aria-label="Pink accent"></button><button type="button" data-accent-choice="blue" aria-label="Blue accent"></button><button type="button" data-accent-choice="neutral" aria-label="Neutral accent"></button></div>
    </div>
  </aside>
  <script type="module" src="app.js?v=32"></script>
</body>
</html>
